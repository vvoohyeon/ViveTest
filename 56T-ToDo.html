}

/* ══════════════════════════════════════════════════════════════════════════
   입력 헬퍼 · 내보내기
   ══════════════════════════════════════════════════════════════════════════ */
/* 입력 중에는 화면을 다시 그리지 않습니다.
   ─ oninput  : 값만 저장하고, 칸 아래 원단위 안내는 그 자리에서 글자만 갈아 끼웁니다.
                (다시 그리지 않으므로 커서가 움직이지 않습니다)
   ─ onchange : 칸을 벗어나거나 Enter를 누를 때 한 번만 전체를 갱신합니다.          */
function numRow(label, path, opts){
  if(opts === true) opts = {plain:true};
  opts = opts || {};
  const v = path.split(".").reduce((o,k)=>o?.[k], S) ?? "";
  return `
  <div>
    <label class="f">${esc(label)}${opts.plain?"":" <span style='font-weight:400;color:var(--ink-3)'>(원)</span>"}${opts.badge||""}</label>
    <input type="number" data-k="${path}" value="${v}" placeholder="0" inputmode="numeric"
      ${opts.plain?"":'step="1"'}
      oninput="${opts.plain?"setNum":"setMoney"}('${path}',this.value,this)" onchange="render()">
    ${opts.plain?"":`<div class="numhint" data-hint="${path}">${v?man(v)+"원":"&nbsp;"}</div>`}
    ${opts.note?`<div class="tiny muted" style="margin-top:2px">${opts.note}</div>`:""}
  </div>`;
}
function setNum(path, val, el){
  const ks = path.split("."); const last = ks.pop();
  let o = S; ks.forEach(k=> o = o[k] = o[k]||{});
  o[last] = Number(val)||0;
  save();
  if(el && el.parentNode){
    const h = el.parentNode.querySelector('[data-hint="'+path+'"]');
    if(h) h.innerHTML = o[last] ? man(o[last])+"원" : "&nbsp;";
  }
}
/* ── 입력 단위 ─────────────────────────────────────────────────────────────
   금액은 내부적으로 언제나 천원으로 저장합니다. 만원 단위를 고르면 화면에서만
   10으로 나눠 보여주고, 0.1만원(=1천원) 단위까지 입력받아 값이 깎이지 않습니다. */
function setMoney(path, val, el){
  const ks = path.split("."); const last = ks.pop();
  let o = S; ks.forEach(k=> o = o[k] = o[k]||{});
  o[last] = Math.round(Number(val)||0);
  save();
  if(el && el.parentNode){
    const h = el.parentNode.querySelector('[data-hint="'+path+'"]');
    if(h) h.innerHTML = o[last] ? man(o[last]) + "원" : "&nbsp;";
  }
}

function setText(path, val){
  const ks = path.split("."); const last = ks.pop();
  let o = S; ks.forEach(k=> o = o[k] = o[k]||{});
  o[last] = val; save();
}

/* ── 금리·이율 ──────────────────────────────────────────────────────────
   소수점 셋째 자리까지 입력합니다 (예: 1.325%, 5.875%).
   입력 중에는 다시 그리지 않고, 칸을 벗어날 때 한 번만 갱신합니다.        */
const RATE_STEP = "0.001";
function pct(v){
  const n = Number(v) || 0;
  return String(Math.round(n * 1000) / 1000);
}
function rateRow(label, path, note){
  const v = path.split(".").reduce((o,k)=>o?.[k], S) ?? "";
  return `
  <div>
    <label class="f">${esc(label)} <span style="font-weight:400;color:var(--ink-3)">(%)</span></label>
    <input type="number" step="${RATE_STEP}" min="0" inputmode="decimal" data-k="${path}"
      value="${v}" placeholder="0" oninput="setNum('${path}',this.value,this)" onchange="render()">
    <div class="numhint">&nbsp;</div>
    ${note?`<div class="tiny muted" style="margin-top:2px">${esc(note)}</div>`:""}
  </div>`;
}

function exportJson() {
  const clean = structuredClone(S);
  clean.sel = normalizeSel(clean.sel);
  clean.saved = (clean.saved || []).filter(value => savedVariant(value) === VARIANT).map(normalizeSaved);
  downloadJson({app:"ipju", kind:"state", v:SCHEMA, variant:VARIANT, project:PROJECT.id, projectName:PROJECT.name, exported:stamp(true), state:clean}, `입주까지_${PROJECT.id}_${VARIANT}_${stamp()}.json`);
  toast("56T 전체 백업을 내보냈습니다 · 다른 사람에게 넘기지 마십시오");
}

function exportFiling(){
  const P = calcPrice(), L = S.filing||{};
  const lines = PROJECT.filingLines.filter(l=>Number(L[l.id]));
  const total = PROJECT.filingLines.reduce((s,l)=>s+Number(L[l.id]||0),0);
  copy(
`■ 주택취득자금 조달 및 입주계획서 (작성용 요약)
${PROJECT.name} · ${P.T.id} ${P.F.band}
신고금액 ${kwon(P.total)}

${lines.map(l=>`${l.no} ${l.name}\n   ${won(L[l.id])}`).join("\n")}

⑬ 합계  ${won(total)}
${Math.abs(total - P.total*1000)===0 ? "✅ 신고금액과 일치" : `🔴 신고금액과 ${won(total-P.total*1000)} 차이`}

* 국토교통부 별지 제1호서식에 옮겨 적으십시오.
* 투기과열지구이므로 항목별 증빙자료 첨부가 필수입니다.`);
}
function exportSummary() {
  const P = calcPrice();
  const C = calcCashflow();
  const D = calcDsr();
  const pr = progress();
  const funding = planBySourceForm();
  const upcoming = PROJECT.milestones
    .filter(m => !S.done[m.id] && m.kind !== "reference" && milestoneEndDelta(m) >= 0)
    .slice(0, 5);
  copy(`■ ${PROJECT.name} · 56T 전용 요약  (${fmtDate(new Date())})

[선택]  56T · T1층~T2층 · ${PROJECT.spaceOptions.find(space => space.id === S.sel.space)?.label}
  총 계약금액   ${kwon(P.total)}
  계약금(26.12) ${kwon(P.contract)}
  중도금(29.07) ${kwon(P.mid)}
  잔금(30.05 예정) ${kwon(P.balance)}

[조달]
  ① 전용 모기지 (LTV ${D.mortgage.ltv}%)  ${won(D.mortgage.amount)}
  ② 임대차보증금                     ${won(funding.L6 || 0)}
  ③ 예금                             ${won(funding.L2 || 0)}
  ④ 그 밖의 자기자금                 ${won((funding.L3 || 0) + (funding.L5 || 0))}
  ⑤ 신용대출                         ${won(funding.L8b || 0)}

[자금]
  총 소요(부대비용 포함)  ${won(C.need)}
  조달 합계              ${won(C.have)}
  ${C.gap >= 0 ? `여유 ${won(C.gap)}` : `부족 ${won(-C.gap)}`}

[DSR]
  본인 단독 ${D.soloRatio.toFixed(1)}%${D.soloRatio > 40 ? " · 기준 초과" : " · 기준 이내"}
  ${S.fin.spouseEmployed ? `부부 합산 ${D.jointRatio.toFixed(1)}%${D.jointRatio > 40 ? " · 기준 초과" : " · 기준 이내"}` : ""}

[일정]  진행 ${pr.done}/${pr.total}
${upcoming.map(m => `  ${m.displayDate}  ${m.timeLabel}  ${m.t}${m.fatal ? " [회복불가]" : ""}`).join("\n")}

[전매]  당첨자 발표일 + 3년 — 거주의무 이행 전에는 양도 불가
        (공고문 p.19 · 주택법 · LH·국토부 회신)`);
}
