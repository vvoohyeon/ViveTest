<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>56T 당첨자 입주 플래너 — 성남복정2 A1</title>
<!-- 배포본 · 개인 데이터 없음 -->
<meta name="theme-color" content="#0f172a">
<style>
/* ══════════════════════════════════════════════════════════
   디자인 토큰
   ══════════════════════════════════════════════════════════ */
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#fafafa; --line:#e4e6ea;
  --ink:#16181d; --ink-2:#5b6270; --ink-3:#8d94a3;
  --accent:#2563eb; --accent-soft:#eff4ff;
  --red:#dc2626; --red-soft:#fef2f2;
  --amber:#d97706; --amber-soft:#fffbeb;
  --green:#059669; --green-soft:#ecfdf5;
  --gray-soft:#f1f2f4;
  --r:14px; --r-sm:9px;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.05);
  --tab-h:60px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0c0e12; --surface:#15181e; --surface-2:#1b1f26; --line:#282d36;
    --ink:#e9ecf1; --ink-2:#9aa3b2; --ink-3:#6b7382;
    --accent:#5b8def; --accent-soft:#182338;
    --red:#f87171; --red-soft:#2a1618;
    --amber:#fbbf24; --amber-soft:#2a2110;
    --green:#34d399; --green-soft:#0f2620;
    --gray-soft:#1e222a;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,
    "Segoe UI","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
  font-feature-settings:"tnum";
}
#shell{max-width:600px;margin:0 auto;min-height:100vh;background:var(--bg);
  padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 12px);position:relative}
@media(min-width:640px){#shell{box-shadow:0 0 0 1px var(--line)}}

/* ── 헤더 ── */
header{position:sticky;top:0;z-index:40;background:var(--surface);
  border-bottom:1px solid var(--line);padding:12px 16px 10px}
.hd-top{display:flex;align-items:baseline;gap:8px;justify-content:space-between}
.hd-name{font-size:16px;font-weight:700;letter-spacing:-.02em}
.hd-sub{font-size:11.5px;color:var(--ink-3)}
.hd-bar{margin-top:9px;height:5px;border-radius:99px;background:var(--gray-soft);overflow:hidden}
.hd-bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.hd-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);margin-top:5px}

/* ── 탭바 ── */
nav{position:fixed;bottom:0;left:0;right:0;z-index:50;
  background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tab-h)}
.nav-in button{background:none;border:0;cursor:pointer;color:var(--ink-3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font:inherit;font-size:10.5px;font-weight:600;padding:0;transition:color .15s}
.nav-in button svg{width:21px;height:21px;stroke-width:1.7}
.nav-in button[aria-selected=true]{color:var(--accent)}

/* ── 레이아웃 ── */
main{padding:14px 14px 8px}
.sec{margin-bottom:20px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 8px}
.sec-h h2{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--ink-3);
  text-transform:uppercase;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden}
.card + .card{margin-top:9px}
.pad{padding:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack{display:flex;flex-direction:column;gap:9px}
.muted{color:var(--ink-2)}
.tiny{font-size:11.5px;line-height:1.5}
.sm{font-size:12.5px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
hr.d{border:0;border-top:1px solid var(--line);margin:11px 0}

/* ── 배지 ── */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;
  padding:2.5px 7px;border-radius:99px;white-space:nowrap;letter-spacing:-.01em}
.b-red{background:var(--red-soft);color:var(--red)}
.b-amber{background:var(--amber-soft);color:var(--amber)}
.b-green{background:var(--green-soft);color:var(--green)}
.b-blue{background:var(--accent-soft);color:var(--accent)}
.b-gray{background:var(--gray-soft);color:var(--ink-2)}

/* ── 마일스톤 ── */
.ms{display:flex;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.ms:last-child{border-bottom:0}
.ms.done{opacity:.5}
.ms-chk{flex:0 0 20px;height:20px;margin-top:1px;border-radius:6px;border:1.8px solid var(--line);
  display:grid;place-items:center;transition:.15s;background:var(--surface)}
.ms.done .ms-chk{background:var(--green);border-color:var(--green)}
.ms-chk svg{width:12px;height:12px;stroke:#fff;stroke-width:3;opacity:0}
.ms.done .ms-chk svg{opacity:1}
.ms-body{flex:1;min-width:0}
.ms-t{font-size:14px;font-weight:600;letter-spacing:-.01em;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ms.done .ms-t{text-decoration:line-through}
.ms-d{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.ms-detail{margin-top:9px;padding:11px;background:var(--surface-2);border-radius:var(--r-sm);
  font-size:12.5px;line-height:1.6}
.ms-detail b{font-weight:600}
.ms-detail .k{color:var(--ink-3);font-size:11px;font-weight:700;letter-spacing:.03em;
  text-transform:uppercase;display:block;margin:8px 0 3px}
.ms-detail .k:first-child{margin-top:0}
.dday{font-variant-numeric:tabular-nums;font-weight:700;font-size:11px}

/* ── 폼 ── */
label.f{display:block;font-size:11.5px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--surface-2);color:var(--ink);font:inherit;font-size:14px;
  font-variant-numeric:tabular-nums;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:var(--surface)}
textarea{min-height:70px;resize:vertical;font-size:13px;line-height:1.6}
.numhint{margin-top:3px;min-height:16px;font-size:11.5px;line-height:1.35;color:var(--ink-2);
  font-variant-numeric:tabular-nums}
/* ── 배분 요약 칩 (접힌 상태) ── */
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chip{display:inline-flex;align-items:baseline;gap:4px;font-size:11px;line-height:1.5;
  padding:2px 8px;border-radius:99px;background:var(--gray-soft);color:var(--ink-2);
  font-variant-numeric:tabular-nums}
.chip b{font-weight:700;color:var(--ink)}
.chip.auto{background:var(--accent-soft);color:var(--accent)}
.chip.auto b{color:var(--accent)}
.chip.off{background:transparent;border:1px dashed var(--line);color:var(--ink-3)}
.chip.off b{color:var(--ink-3);font-weight:600}

/* ── 좌우 2단 요약 ── */
.duo{display:grid;grid-template-columns:1fr 1fr}
.duo>div{padding:13px 12px;min-width:0}
.duo>div+div{border-left:1px solid var(--line)}
.duo .lab{font-size:10.5px;color:var(--ink-3);font-weight:700;letter-spacing:.03em}
.duo .big{font-size:clamp(15px,4.4vw,20px);font-weight:800;letter-spacing:-.03em;
  margin-top:3px;line-height:1.2;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.duo .sub{margin-top:8px;padding-top:7px;border-top:1px solid var(--line)}
.duo .sub .kv{font-size:11.5px;padding:4px 0;border:0}
.duo .sub .kv b{font-size:11.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 14px;border-radius:var(--r-sm);border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font:inherit;font-size:13px;font-weight:600;
  cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--ink-3)}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.p:hover{filter:brightness(1.08)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.w{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ── 세그먼트 ── */
.seg{display:flex;gap:4px;background:var(--gray-soft);padding:3px;border-radius:10px;overflow-x:auto;
  scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;white-space:nowrap;padding:7px 10px;border:0;background:none;border-radius:7px;
  font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer;transition:.15s}
.seg button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* ── 옵션 ── */
.opt-g{border-bottom:1px solid var(--line);padding:12px 14px}
.opt-g:last-child{border-bottom:0}
.opt-g > .row{margin-bottom:8px}
.opt-name{font-size:13px;font-weight:700;letter-spacing:-.01em}
.opt-base{font-size:11px;color:var(--ink-3);margin-top:1px}
.opt{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border-radius:var(--r-sm);
  border:1px solid var(--line);cursor:pointer;transition:.13s;background:var(--surface-2);margin-top:6px}
.opt:hover{border-color:var(--ink-3)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt.off{opacity:.5;cursor:not-allowed}
.opt input{margin:3px 0 0;accent-color:var(--accent);flex:0 0 auto}
.opt-l{flex:1;min-width:0;font-size:12.5px;line-height:1.45}
.opt-p{font-size:12.5px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.opt-why{font-size:10.5px;color:var(--amber);margin-top:3px;line-height:1.4}

/* ── 옵션 그림 ── */
.opt-img{flex:0 0 74px;width:74px;height:58px;border-radius:7px;object-fit:cover;
  background:var(--gray-soft);border:1px solid var(--line);cursor:zoom-in;display:block}
.base-thumb{flex:0 0 52px;width:52px;height:42px;border-radius:6px;object-fit:cover;
  border:1px solid var(--line);background:var(--gray-soft);cursor:zoom-in}
.opt-img.ph,.base-thumb.ph{display:grid;place-items:center;font-size:9px;color:var(--ink-3);
  text-align:center;line-height:1.2;cursor:default;padding:2px;overflow:hidden;font-weight:600}
.plan-img{width:100%;display:block;border-radius:var(--r);border:1px solid var(--line);cursor:zoom-in}
/* ── 모달 ── */
.modal{position:fixed;inset:0;z-index:150;background:rgba(8,10,14,.5);display:none;
  align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.modal.on{display:flex}
.modal-box{background:var(--surface);width:100%;max-width:600px;max-height:88vh;
  border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 -8px 40px rgba(0,0,0,.28)}
@media(min-width:640px){.modal{align-items:center;padding:20px}
  .modal-box{border-radius:16px;max-height:84vh}}
.modal-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 16px;border-bottom:1px solid var(--line);flex:0 0 auto;background:var(--surface)}
.modal-hd b{font-size:15px;font-weight:700;letter-spacing:-.02em}
.modal-body{padding:14px 16px 24px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-x{border:0;background:var(--gray-soft);color:var(--ink-2);width:30px;height:30px;
  border-radius:50%;font-size:17px;line-height:1;cursor:pointer;flex:0 0 auto}
.linkrow{display:flex;align-items:center;justify-content:space-between;gap:10px;
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--surface-2);cursor:pointer;font:inherit;text-align:left;color:var(--ink)}
.linkrow:hover{border-color:var(--ink-3)}
.linkrow .lr-l{font-size:12.5px;font-weight:600}
.linkrow .lr-s{font-size:11px;color:var(--ink-3);margin-top:1px}
.linkrow .lr-r{font-size:13px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}

/* ── 저장 불가 경고 띠 ── */
#nosave{background:var(--amber-soft);border-bottom:1px solid var(--amber);
  color:var(--ink);font-size:12.5px;line-height:1.65;padding:10px 16px}
#nosave[hidden]{display:none}
#nosave b{color:var(--amber)}
#nosave .lnk{border:0;background:none;padding:0;font:inherit;color:var(--accent);
  text-decoration:underline;cursor:pointer}

#lb{position:fixed;inset:0;z-index:200;background:rgba(8,10,14,.92);display:none}
#lb.on{display:block}
#lb .stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  overflow:hidden;padding:18px;cursor:zoom-out;touch-action:none;overscroll-behavior:contain}
#lb img{max-width:100%;max-height:82vh;border-radius:10px;display:block;
  transform-origin:center center;will-change:transform;user-select:none;-webkit-user-drag:none}
#lb.z .stage{cursor:grab}
#lb.z.drag .stage{cursor:grabbing}
#lb .cap{position:absolute;left:0;right:0;bottom:22px;text-align:center;color:#fff;
  font-size:13px;font-weight:600;padding:0 20px;text-shadow:0 1px 3px rgba(0,0,0,.6);
  pointer-events:none}
#lb .tools{position:absolute;right:12px;z-index:2;display:flex;gap:6px;
  top:calc(12px + env(safe-area-inset-top))}
#lb .tools button{min-width:38px;height:38px;padding:0 10px;border-radius:9px;cursor:pointer;
  border:1px solid rgba(255,255,255,.22);background:rgba(20,24,32,.72);color:#fff;
  font-size:14px;font-weight:700;font-family:inherit;backdrop-filter:blur(6px)}
#lb .tools button:active{background:rgba(60,68,84,.9)}
#lb.compare-mode{display:flex;align-items:stretch;justify-content:center}
#lb.compare-mode .stage,#lb.compare-mode .cap,#lb.compare-mode .tools{display:none}
#lbCompare{display:none}
#lb.compare-mode #lbCompare{display:flex;flex-direction:column;width:min(860px,100%);height:100%;box-sizing:border-box;
  padding:calc(14px + env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom));color:#fff}
.lb-compare-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex:0 0 auto}
.lb-compare-title{font-size:15px;font-weight:800;letter-spacing:-.02em}
.lb-compare-sub{margin-top:3px;font-size:11.5px;color:rgba(255,255,255,.7)}
.lb-compare-close{width:38px;height:38px;border:1px solid rgba(255,255,255,.24);border-radius:10px;
  background:rgba(20,24,32,.72);color:#fff;font-family:inherit;font-size:17px;font-weight:700;line-height:1;cursor:pointer;flex:0 0 auto}
.lb-compare-main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:9px;padding:12px 0 10px;text-align:center}
.lb-compare-main img{max-width:100%;max-height:min(61vh,560px);object-fit:contain;border-radius:12px;transform:none;will-change:auto}
.lb-compare-main .ph{width:min(82vw,520px);height:min(49vh,360px);display:grid;place-items:center;border:1px dashed rgba(255,255,255,.35);
  border-radius:12px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.65);font-size:13px;font-weight:700;line-height:1.35}
.lb-compare-main-name{max-width:100%;font-size:14px;font-weight:700;line-height:1.4}
.lb-compare-main-price{font-size:12px;color:rgba(255,255,255,.72);font-variant-numeric:tabular-nums}
.lb-compare-select{display:inline-flex;align-items:center;gap:7px;margin-top:2px;padding:8px 12px;border:1px solid rgba(255,255,255,.25);
  border-radius:9px;background:rgba(255,255,255,.1);color:#fff;font-family:inherit;font-size:12px;font-weight:600;line-height:1.2;cursor:pointer}
.lb-compare-select:has(input:checked){background:var(--accent);border-color:var(--accent)}
.lb-compare-select:has(input:disabled){opacity:.5;cursor:not-allowed}
.lb-compare-select input{width:16px;height:16px;margin:0;accent-color:#fff}
.lb-compare-unavailable{max-width:100%;font-size:11px;line-height:1.4;color:#ffd28a}
.lb-compare-strip{display:flex;flex:0 0 auto;justify-content:center;gap:8px;overflow-x:auto;padding:9px 0 2px;scrollbar-width:thin;
  overscroll-behavior:contain}
.lb-compare-thumb{display:flex;flex:0 0 106px;flex-direction:column;align-items:stretch;gap:4px;padding:6px;border:1px solid rgba(255,255,255,.18);
  border-radius:9px;background:rgba(255,255,255,.07);color:#fff;text-align:left;font:inherit;cursor:pointer}
.lb-compare-thumb[aria-selected=true]{border-color:var(--accent);background:rgba(66,133,244,.25);box-shadow:0 0 0 1px var(--accent) inset}
.lb-compare-thumb img,.lb-compare-thumb .ph{width:94px;height:60px;box-sizing:border-box;object-fit:cover;border-radius:6px;
  border:1px solid rgba(255,255,255,.18);transform:none;will-change:auto}
.lb-compare-thumb .ph{display:grid;place-items:center;background:rgba(255,255,255,.08);color:rgba(255,255,255,.62);font-size:9px;font-weight:700;line-height:1.2;text-align:center}
.lb-compare-thumb-name{font-size:10.5px;font-weight:700;line-height:1.3;min-height:27px;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.lb-compare-thumb-price{font-size:10px;color:rgba(255,255,255,.7);font-variant-numeric:tabular-nums;white-space:nowrap}
.compare-trigger{cursor:pointer!important}


/* ── 금액 바 ── */
.pricebar{position:sticky;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom));z-index:30;
  margin:0 -14px;padding:11px 16px;background:var(--surface);border-top:1px solid var(--line);
  box-shadow:0 -3px 12px rgba(16,24,40,.06)}
.pricebar .tot{display:flex;justify-content:space-between;align-items:baseline}
.pricebar .tot b{font-size:19px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.pb-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;
  padding-top:8px;border-top:1px solid var(--line)}
.pb-grid div{text-align:center}
.pb-grid span{display:block;font-size:9.5px;color:var(--ink-3);font-weight:600}
.pb-grid b{display:block;font-size:11.5px;font-weight:700;margin-top:1px;font-variant-numeric:tabular-nums}

/* ── 표 ── */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:8px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:10.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.03em;
  background:var(--surface-2)}
th:first-child,td:first-child{text-align:left;white-space:normal}
tbody tr:last-child td{border-bottom:0}
tr.sum td{font-weight:700;background:var(--surface-2)}
tr.on td{background:var(--accent-soft)}

/* ── 판정/알림 ── */
.verdict{padding:14px;border-radius:var(--r);border:1px solid;line-height:1.6}
.v-red{background:var(--red-soft);border-color:color-mix(in srgb,var(--red) 30%,transparent)}
.v-amber{background:var(--amber-soft);border-color:color-mix(in srgb,var(--amber) 30%,transparent)}
.v-green{background:var(--green-soft);border-color:color-mix(in srgb,var(--green) 30%,transparent)}
.v-t{font-size:15px;font-weight:800;letter-spacing:-.02em;margin-bottom:5px}
.cite{font-size:11px;color:var(--ink-3);line-height:1.55;padding-left:9px;
  border-left:2px solid var(--line);margin-top:8px}
.note{padding:10px 12px;border-radius:var(--r-sm);font-size:12px;line-height:1.55;
  background:var(--amber-soft);color:var(--ink)}
.note.i{background:var(--accent-soft)}
.note.e{background:var(--red-soft)}

/* ── 스탯 ── */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px}
.stat span{display:block;font-size:10.5px;color:var(--ink-3);font-weight:600}
.stat b{display:block;font-size:17px;font-weight:800;letter-spacing:-.03em;margin-top:3px;
  font-variant-numeric:tabular-nums}
.stat em{display:block;font-style:normal;font-size:10.5px;color:var(--ink-3);margin-top:2px}

/* ── 게이지 ── */
.gauge{height:8px;border-radius:99px;background:var(--gray-soft);overflow:hidden;margin:7px 0 4px;position:relative}
.gauge>i{display:block;height:100%;border-radius:99px;transition:width .4s}
.gauge>u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink-3);opacity:.8}

/* ── 체크리스트 ── */
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.chk input{margin:2px 0 0;width:17px;height:17px;accent-color:var(--green);flex:0 0 auto}
.chk.done .chk-t{text-decoration:line-through;color:var(--ink-3)}
.chk-t{font-size:13px;font-weight:500}
.chk-s{font-size:11px;color:var(--ink-3);margin-top:1px}

details.acc{border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2)}
details.acc + details.acc{margin-top:7px}
details.acc summary{padding:10px 12px;cursor:pointer;font-size:12.5px;font-weight:600;list-style:none}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::before{content:"▸ ";color:var(--ink-3)}
details.acc[open] summary::before{content:"▾ "}
details.acc .acc-b{padding:0 12px 12px;font-size:12px;line-height:1.65;color:var(--ink-2)}

.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv:last-child{border-bottom:0}
.kv b{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.kv span{color:var(--ink-2)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 22px);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13px;
  font-weight:600;z-index:99;opacity:0;pointer-events:none;transition:.25s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}

@media print{
  nav,.pricebar,header{position:static}
  nav,.btn,.seg{display:none!important}
  #shell{max-width:none;padding:0}
  .card{break-inside:avoid;box-shadow:none}
}

/* 56T 전용 접근성·일정·가격 보강 */
body{font-variant-numeric:tabular-nums}
.nav-in{grid-template-columns:repeat(4,1fr)}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 68%,transparent);outline-offset:2px}
.btn,.btn.sm,.seg button,label.opt{min-height:44px}.btn,.btn.sm,.seg button{min-width:44px}

.ms-head{display:grid;grid-template-columns:44px minmax(0,1fr);align-items:stretch}
.ms-check-control{display:grid;place-items:start center;width:44px;min-width:44px;min-height:44px;padding:12px 0;border:0;background:transparent;color:inherit;cursor:pointer}
.ms-chk{margin:0;pointer-events:none}.ms-toggle{display:grid;grid-template-columns:minmax(0,1fr) 44px;align-items:center;width:100%;min-height:60px;padding:10px 0;border:0;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer}
.ms-toggle-body{display:block;min-width:0}.ms-t{display:flex}.ms-meta{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;margin-top:4px;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.ms-date,.ms-time{text-align:left;min-width:0;overflow-wrap:anywhere}.ms-dday,.ms-effort{text-align:right;white-space:nowrap;font-weight:700}.ms-time{color:var(--ink-2)}
.ms-chevron{width:20px;height:20px;margin:auto;transition:transform .18s;color:var(--ink-3)}.ms-toggle[aria-expanded=true] .ms-chevron{transform:rotate(180deg)}
.ms-detail{margin:0 14px 12px 58px}.ms-detail[hidden]{display:none}.ms.done .ms-t{text-decoration:none}.ms.done .ms-t>*:first-child{text-decoration:line-through}
.unit-summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.unit-summary-grid>div{padding:9px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2)}.unit-summary-grid span{display:block;font-size:10.5px;color:var(--ink-3);font-weight:700}.unit-summary-grid b{display:block;margin-top:2px;font-size:13px;overflow-wrap:anywhere}
.fixed-fact{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2)}.fixed-fact>span{font-size:11px;color:var(--ink-3);font-weight:700}.fixed-fact>b{text-align:right}.fixed-fact>em{grid-column:1/-1;font-style:normal;font-size:11px;color:var(--ink-3)}
.price-kv-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.price-kv{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:11px 13px;border-bottom:1px solid var(--line)}.price-kv:nth-child(odd){border-right:1px solid var(--line)}.price-kv span{font-size:12px;color:var(--ink-2)}.price-kv b{font-size:13px;font-variant-numeric:tabular-nums;text-align:right}.price-kv.total{background:var(--accent-soft)}.price-kv.total b{font-size:15px;color:var(--accent)}.price-kv-grid.compact{border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.pb-breakdown{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid var(--line)}.pb-breakdown div{text-align:center;min-width:0}.pb-breakdown span,.pb-breakdown b{display:block}.pb-breakdown span{font-size:9px;color:var(--ink-3)}.pb-breakdown b{font-size:10.5px;overflow-wrap:anywhere}.pricebar .tot b{white-space:nowrap}
.scenario-wrap{overflow:hidden}.scenario-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}.scenario-table{min-width:980px}.scenario-table .badge{margin-left:5px}.scroll-hint{padding:7px 10px;border-top:1px solid var(--line);font-size:10.5px;color:var(--ink-3);text-align:center;background:var(--surface-2)}
.scenario-disclosure{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;width:100%;min-height:44px;padding:0;border:0;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer}.scenario-disclosure>span{min-width:0}.scenario-disclosure b{font-size:13px}.scenario-disclosure small{display:block;margin-top:2px;font-size:11px;color:var(--ink-3);overflow-wrap:anywhere}.scenario-detail{margin-top:9px}
.conflict-card{border-width:1.5px}
@media(max-width:420px){
  main{padding-left:12px;padding-right:12px}.sec-h{align-items:flex-start}.sec-h>.row{flex-wrap:wrap;justify-content:flex-end}.ms-meta{gap:3px 8px}.ms-detail{margin-left:12px}.unit-summary-grid{gap:7px}.price-kv-grid{grid-template-columns:1fr}.price-kv:nth-child(odd){border-right:0}.pb-breakdown{grid-template-columns:repeat(2,1fr);row-gap:8px}.pricebar{margin-left:-12px;margin-right:-12px}.pricebar .tot b{font-size:16px}.stats{gap:7px}.stat{padding:10px}.stat b{font-size:15px}.grid2{gap:7px}.lb-compare-strip{justify-content:flex-start}
}
@media print{
  nav,.pricebar,.no-print,.ms-check-control,.ms-chevron,.opt input,.scenario-disclosure+div+.grid2{display:none!important}
  header{position:static}.ms-head{grid-template-columns:1fr}.ms-toggle{display:block;min-height:0;padding:8px 12px;cursor:default}.ms-detail,.ms-detail[hidden]{display:block!important;margin:0 12px 10px}.ms{break-inside:avoid}.scenario-scroll{overflow:visible}.scenario-table{min-width:0;font-size:10px}.scroll-hint{display:none}.opt{break-inside:avoid}.sec{break-inside:auto}
}

/* ══════════════════════════════════════════════════════════════════════════
   L3 · 룰 (RULES) — 법령·금융 판정 규칙
   ══════════════════════════════════════════════════════════════════════════ */
const RULES = {
  // 원리금균등 연간 상환액
  annuity(principal, ratePct, years){
    if(!principal || !years) return 0;
    const r = ratePct/100/12, n = years*12;
    if(r === 0) return principal/years;
    const m = principal * (r*Math.pow(1+r,n)) / (Math.pow(1+r,n)-1);
    return m*12;
  },

  /* DTI — 주택담보대출은 연 원리금 전액, 그 밖의 대출은 연 이자만 더합니다.
     (DSR 은 모든 대출의 원리금을 더하므로 DTI 보다 크게 나옵니다)          */
  dti(rows, income){
    let annual = 0;
    rows.forEach(L=>{
      annual += (L.type === "mortgage")
        ? L.annual                       // 주담대: 원리금 전액
        : L.base * (L.rate/100);         // 신용·마통: 이자만 (마통은 한도 기준)
    });
    return {annual, ratio: income>0 ? annual/income*100 : 0};
  },

  // DSR — 마이너스통장은 한도 전액을 5년 원리금균등으로 산입
  dsr(loans, income){
    let annual = 0;
    const rows = loans.map(L=>{
      const base = L.type==="line" ? L.limit : L.amount;
      const yrs  = L.type==="line" ? 5 : L.years;
      const a = RULES.annuity(base, L.rate, yrs);
      annual += a;
      return {...L, base, yrs, annual:a};
    });
    return {rows, annual, ratio: income>0 ? annual/income*100 : 0};
  },

  // 유상취득 취득세 (주택)
  acquisitionTax(price, exclusiveArea, firstTime){
    const eok = price/100000000;
    let rate, band;
    if(eok <= 6){ rate = 0.01; band = "6억원 이하 · 1%"; }
    else if(eok <= 9){
      rate = (eok*2/3 - 3)/100;
      band = "6억 초과 9억 이하 · (취득가액(억)×2÷3−3)%";
    } else { rate = 0.03; band = "9억원 초과 · 3%"; }
    rate = Math.round(rate*1e7)/1e7;
    const acq = Math.floor(price*rate);
    const eduTax = Math.floor(price*rate*0.5*0.2);            // 지방교육세
    const ruralTax = exclusiveArea > 85 ? Math.floor(price*0.002) : 0;  // 농특세 (85㎡ 초과만)
    const relief = firstTime ? Math.min(2000000, acq) : 0;     // 생애최초 감면 최대 200만
    return {rate, band, eok, acq, eduTax, ruralTax, relief, total: acq + eduTax + ruralTax - relief};
  },

  // 비영업대금의 이익 (차용증 이자소득)
  interestTax(interest){
    const income = Math.floor(interest*0.25);          // 소득세 25%
    const local  = Math.floor(income*0.1);             // 지방소득세 10% (=2.5%)
    return {income, local, total:income+local, rate:27.5};
  },

  // 수익공유 정산비율 (%) — 담보인정비율 × 경과연수 × 자녀수
  mortgageShare(ltv, band, children){
    const M = PROJECT.mortgage;
    const row = M.shareTable[band] || M.shareTable[24];
    const cell = row[ltv] || row[30];
    return cell[Math.min(2, Math.max(0, children))];
  },

  // 자금조달계획서 소명 리스크
  filingRisk(lines, total, declared, income3y){
    const R = [];
    const g = id => Number(lines[id]||0);
    const self = ["L2","L3","L4","L5","L6"].reduce((s,k)=>s+g(k),0);
    const loan = ["L8","L8b","L8c","L9","L10","L11"].reduce((s,k)=>s+g(k),0);
    if(Math.abs(total-declared) > 0)
      R.push({lv:"red", t:"신고금액 불일치",
        d:`계획서 합계 ${won(total)} ≠ 신고금액 ${won(declared)} (차 ${won(total-declared)}). 반드시 일치시켜야 합니다.`});
    if(g("L4") > 0)
      R.push({lv:"red", t:"④ 증여·상속 기재",
        d:"편법증여 심사의 1순위 칸입니다. 증여세 신고서와 실제 이체내역이 함께 요구됩니다."});
    if(g("L11") > 0)
      R.push({lv:"red", t:"⑪ 그 밖의 차입금 기재",
        d:"특수관계인 차입으로 분류되면 차용증·이자 지급내역·상환능력 증빙이 요구됩니다. 이자 지급 사실이 확인되면 대여자의 이자소득세 신고 여부도 함께 검토됩니다."});
    if(income3y > 0 && g("L2") > income3y)
      R.push({lv:"amber", t:"② 예금액이 최근 소득 합계를 초과",
        d:`예금 ${won(g("L2"))} > 소득 합계 ${won(income3y)}. 자금 형성 과정을 보여줄 통장내역이 요구될 수 있습니다.`});
    if(total>0 && loan/total > 0.7)
      R.push({lv:"amber", t:"차입금 비중 70% 초과",
        d:`차입 비중 ${(loan/total*100).toFixed(1)}%. LTV·DSR 충족 여부와 대출 실행 가능성이 함께 확인됩니다.`});
    if(total>0 && self/total < 0.2)
      R.push({lv:"amber", t:"자기자금 비율 20% 미만",
        d:`자기자금 ${(self/total*100).toFixed(1)}%. 잔금 미납 위험 관점에서 소명 요구 가능성이 높아집니다.`});
    if(!R.length)
      R.push({lv:"green", t:"두드러진 트리거 없음",
        d:"다만 투기과열지구이므로 계약 시 증빙자료 제출이 의무이며, 잔금 이후에도 자료제출 요구가 가능합니다 (부동산거래신고법 §6)."});
    return {risks:R, self, loan};
  }
};

/* 배포본입니다 — 개인 시드 데이터가 들어 있지 않습니다.
   빈 상태로 시작하며, 「프로젝트 파일에서 불러오기」로 값을 가져올 수 있습니다. */
const SEED = null;

/* ══════════════════════════════════════════════════════════════════════════
   L2 · 상태 (온디바이스 · localStorage)
   ══════════════════════════════════════════════════════════════════════════ */
const SCHEMA = 4;
const VARIANT = "56T";
const KEY = "ipju:" + PROJECT.id + ":" + VARIANT;
const BLANK = {
  sel:{type:"56T", floor:0, space:"base", minus:false, opts:{}},
  fin:{incomeSelf:0, incomeSpouse:0, spouseEmployed:false, income3y:0,
       mortgage:{enabled:true, ltv:30, years:30, children:0, band:24, rate:1.3}, expectedSale:0,
       loans:[],
       acqFirstTime:true, bondRate:8, judicial:700000, stamp:150000, mgmtDeposit:600000,
       midRate:4.5, midMonths:10, limits:{ltv:70, dti:60, dsr:40}},
  filing:{}, loanNote:{principal:0, rate:0, monthly:0, start:"", balance:0, years:5},
  done:{}, docs:{}, notes:{}, extraResponses:[], saved:[], plan:{}, v:SCHEMA
};
let S = load();
function normalizeSel(input) {
  const raw = input && typeof input === "object" ? input : {};
  const spaces = new Set(PROJECT.spaceOptions.map(x => x.id));
  const opts = {};
  const incoming = raw.opts && typeof raw.opts === "object" ? raw.opts : {};
  for (const group of PROJECT.options["56T"]) {
    const id = incoming[group.g];
    if (group.items.some(item => item.id === id)) opts[group.g] = id;
  }
  return {
    type:"56T",
    floor:0,
    space:spaces.has(raw.space) ? raw.space : "base",
    minus:!!raw.minus,
    opts
  };
}

function savedVariant(v) {
  if (!v || typeof v !== "object") return "";
  const declared = [v.variant, v.sel && v.sel.type, v.state && v.state.sel && v.state.sel.type, v.type].filter(Boolean);
  if (!declared.length) return "";
  return declared.every(value => value === declared[0]) ? declared[0] : "__mixed__";
}

function normalizeSaved(v) {
  const copy = structuredClone(v);
  copy.variant = VARIANT;
  copy.type = VARIANT;
  if (copy.sel) copy.sel = normalizeSel(copy.sel);
  if (copy.state && copy.state.sel) copy.state.sel = normalizeSel(copy.state.sel);
  copy.floor = PROJECT.types[0].floors[0].band;
  return copy;
}

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return structuredClone(BLANK);
    const parsed = JSON.parse(raw);
    const s = Object.assign(structuredClone(BLANK), parsed);
    s.v = Number(parsed.v) || 0;
    return migrate(s);
  } catch (error) {
    return structuredClone(BLANK);
  }
}

function migrate(s) {
  s = Object.assign(structuredClone(BLANK), s || {});
  s.fin = Object.assign(structuredClone(BLANK.fin), s.fin || {});
  s.filing = s.filing && typeof s.filing === "object" ? s.filing : {};
  s.plan = s.plan && typeof s.plan === "object" ? s.plan : {};
  s.loanNote = Object.assign(structuredClone(BLANK.loanNote), s.loanNote || {});
  s.done = s.done && typeof s.done === "object" ? s.done : {};
  s.docs = s.docs && typeof s.docs === "object" ? s.docs : {};
  s.notes = s.notes && typeof s.notes === "object" ? s.notes : {};
  s.extraResponses = Array.isArray(s.extraResponses) ? s.extraResponses : [];

  const f = s.fin;
  const mortgageIndex = (f.loans || []).findIndex(loan => /모기지/.test(loan.name || ""));
  if (mortgageIndex >= 0) {
    const old = f.loans[mortgageIndex];
    if (!f.mortgage || f.mortgage.__migrated !== true) {
      const T = PROJECT.types[0];
      const price = T.floors[0].price + T.balcony.price;
      const M2 = PROJECT.mortgage;
      const ltv = M2.ltvChoices.find(v => Math.min(Math.floor(price * v / 100), M2.cap) >= (old.amount || 0)) || M2.minLtv;
      f.mortgage = {enabled:true, ltv, years:old.years || 30, children:0, band:24, __migrated:true};
    }
    f.loans.splice(mortgageIndex, 1);
  }
  if (!f.mortgage) f.mortgage = structuredClone(BLANK.fin.mortgage);

  if ((s.v || 0) < 3) {
    const up = (object, key, min) => {
      const value = Number(object && object[key]) || 0;
      if (value > 0 && value < min) object[key] = Math.round(value * 1000);
    };
    ["judicial","stamp","mgmtDeposit"].forEach(key => up(f, key, 10000));
    ["incomeSelf","incomeSpouse","income3y","expectedSale"].forEach(key => up(f, key, 1000000));
    (f.loans || []).forEach(loan => ["amount","limit","used"].forEach(key => up(loan, key, 1000000)));
    Object.keys(s.filing).forEach(key => up(s.filing, key, 1000000));
    ["principal","balance"].forEach(key => up(s.loanNote, key, 1000000));
    up(s.loanNote, "monthly", 100000);
    Object.values(s.plan).forEach(rows => (rows || []).forEach(row => up(row, "amt", 1000000)));
    delete f.unit;
    delete s.unitWon;
  }
  ["src","deposit","severance","rentDeposit","otherFin","otherFinLine","savingMonthly","savingMonths"].forEach(key => delete f[key]);
  delete s.filingSrc;

  s.sel = normalizeSel(s.sel);
  const allowedMilestones = new Set(PROJECT.milestones.map(m => m.id));
  Object.keys(s.done).forEach(id => { if (!allowedMilestones.has(id)) delete s.done[id]; });
  Object.keys(s.notes).forEach(key => {
    if (key.startsWith("_open_") && !allowedMilestones.has(key.slice(6))) delete s.notes[key];
  });
  s.saved = (Array.isArray(s.saved) ? s.saved : []).filter(v => savedVariant(v) === VARIANT).map(normalizeSaved);
  s.v = SCHEMA;
  return s;
}
/* 저장소가 실제로 되는지 한 번 써 보고 판단합니다.
   시크릿 창, iOS 파일 미리보기, 일부 뷰어 앱에서는 막혀 있어
   창을 닫으면 입력이 사라집니다 — 그때는 화면 위에 띠를 띄웁니다.   */
let STORAGE_OK = (function(){
  try{
    const k = KEY + ":test";
    localStorage.setItem(k, "1");
    const ok = localStorage.getItem(k) === "1";
    localStorage.removeItem(k);
    return ok;
  }catch(e){ return false; }
})();
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ STORAGE_OK = false; /* 저장소 차단 — 세션 동안만 유지 */ }
}
function hasSaved(){
  try{ return !!localStorage.getItem(KEY); }catch(e){ return false; }
}
function seed(){
  if(!SEED) return toast("배포본에는 시드 데이터가 없습니다");
  S = Object.assign(structuredClone(BLANK), structuredClone(SEED));
  save(); render(); toast("시드 데이터를 불러왔습니다");
}
function reset(){
  if(!confirm("입력한 모든 데이터를 지웁니다. 계속할까요?")) return;
  S = structuredClone(BLANK); save(); render(); toast("초기화했습니다");
}

const $ = s => document.querySelector(s);
const nf = new Intl.NumberFormat("ko-KR");
const won  = n => nf.format(Math.round(n||0)) + "원";
const kwon = n => won((n||0)*1000);                  // 천원 → 원
const man  = n => { n = Math.round((n||0)/10000); return nf.format(n)+"만"; };
const esc  = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* toISOString() 은 UTC 라 오전에는 날짜가 하루 밀립니다 — 파일명·기록은 로컬 시각으로 */
function stamp(withTime){
  const d = new Date(), p = n => String(n).padStart(2,"0");
  const day = `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
  return withTime ? `${day} ${p(d.getHours())}:${p(d.getMinutes())}` : day;
}
function fmtDate(d){ d = (d instanceof Date)? d : new Date(d);
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`; }
function parseLocalDate(value) {
  const [year, month, day] = String(value).slice(0, 10).split("-").map(Number);
  return new Date(year, month - 1, day);
}

function dday(dateStr) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  return Math.round((parseLocalDate(dateStr) - today) / 86400000);
}
function ddayLabel(n){ return n===0 ? "D-DAY" : n>0 ? "D-"+n : "D+"+(-n); }
let toastT;
function toast(msg){
  const el = $("#toast"); el.textContent = msg; el.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(()=>el.classList.remove("on"), 1900);
}
function copy(text){

    ()=>toast("복사 실패 — 직접 선택해 복사하세요"));
}
const LV = {1:{c:"b-red",  t:"필수"},
            2:{c:"b-amber",t:"중요"},

/* ══════════════════════════════════════════════════════════════════════════
   계산 엔진
   ══════════════════════════════════════════════════════════════════════════ */
function getType() {
  return PROJECT.types[0];
}

function optionTable() {
  return PROJECT.options["56T"];
}

function groupNo(g) {
  const group = optionTable().find(x => x.g === g);
  return group ? group.n.slice(0, 1) : "";
}

function optAvailable(item) {
  if (item.requires) {
    const [group, id] = item.requires.split(":");
    if (S.sel.opts[group] !== id) return {ok:false, why:item.req};
  }
  if (item.blockedSpace && S.sel.space === item.blockedSpace) {
    return {ok:false, why:item.blockedWhy || item.req};
  }
  if (item.requiresSpace && S.sel.space !== item.requiresSpace) {
    return {ok:false, why:item.req};
  }
  return {ok:true};
}

function calcPrice() {
  const T = getType();
  const F = T.floors[0];
  const minus = S.sel.minus;
  const FB = minus && F.minus ? F.minus : F;
  const BB = minus && T.balcony.minus ? T.balcony.minus : T.balcony;
  const base = {p:FB.price, c:FB.c, m:FB.m, b:FB.b};
  const balc = BB;
  let space = {p:0, c:0, m:0, b:0};
  const opts = [];
  if (!minus) {
    if (S.sel.space === "sp2") {
      space = {p:T.spacePremium.price, c:T.spacePremium.c, m:T.spacePremium.m, b:T.spacePremium.b};
    }
    optionTable().forEach(group => {
      const pick = S.sel.opts[group.g];
      const item = group.items.find(candidate => candidate.id === pick);
      if (item && optAvailable(item).ok) opts.push({g:group.n, ...item});
    });
  }
  const optSum = opts.reduce((sum, option) => ({p:sum.p + option.p, c:sum.c + option.c, m:sum.m + option.m, b:sum.b + option.b}), {p:0, c:0, m:0, b:0});
  const total = base.p + balc.price + space.p + optSum.p;
  const contract = base.c + balc.c + space.c + optSum.c;
  const mid = base.m + balc.m + space.m + optSum.m;
  const balance = base.b + balc.b + space.b + optSum.b;
  return {T, F, base, balc, space, opts, optSum, total, contract, mid, balance};
}

function calcExtraCosts(){
  const P = calcPrice();
  const price = P.total*1000;
  const tax = RULES.acquisitionTax(price, P.T.exclusive, S.fin.acqFirstTime);
  const bond = Math.floor(price*0.031*(S.fin.bondRate/100));   // 채권 매입 후 즉시매도 할인손실 추정
  const judicial = S.fin.judicial||0;
  const stamp = S.fin.stamp||0;
  const mgmt = S.fin.mgmtDeposit||0;
  // 중도금 이자는 집단대출을 쓸 때만 발생합니다 (이자후불제 가정)
  const midInt = midLoanOn()
    ? Math.floor(P.mid*1000 * (S.fin.midRate/100) * (S.fin.midMonths/12)) : 0;
  const total = tax.total + bond + judicial + stamp + mgmt + midInt;
  return {tax, bond, judicial, stamp, mgmt, midInt, total, price};
}

/* ── 신혼희망타운 전용 모기지 (F3-2) ───────────────────────────────────────
   담보인정비율(30·40·50·60·70%)을 고르면 금액이 정해집니다.
   선택 비율로 계산한 금액이 가입한도 4억을 넘으면 4억으로 잘리고,
   그때는 실제 LTV 기준으로 수익공유비율이 재적용됩니다. (공고문 3쪽)          */
function calcMortgage(){
  const M = PROJECT.mortgage;
  const cfg = S.fin.mortgage || {};
  const P = calcPrice();
  const price = P.total*1000;                        // 원
  const cap = M.cap*1000;
  if(cfg.enabled === false)
    return {on:false, amount:0, annual:0, price, cap};
  const ltv = cfg.ltv || M.minLtv;
  const raw = Math.floor(price * ltv / 100);
  const amount = Math.min(raw, cap);
  const capped = raw > cap;
  const ltvActual = price ? amount / price * 100 : 0;
  // 한도로 잘린 경우 실제 LTV가 속하는 구간으로 정산비율 재적용
  const effLtv = capped
    ? (M.ltvChoices.filter(v => v <= ltvActual).pop() || M.minLtv)
    : ltv;
  const years = cfg.years || 30;
  const band  = cfg.band  || 24;
  const children = cfg.children || 0;
  const rate  = (cfg.rate != null && cfg.rate !== "") ? Number(cfg.rate) : M.rate;
  const share = RULES.mortgageShare(effLtv, band, children);
  const annual = RULES.annuity(amount, rate, years);
  const sale = S.fin.expectedSale||0;
  const gain = Math.max(0, sale - price);
  return {on:true, ltv, ltvActual, effLtv, capped, amount, annual, years, band, children, rate,
          share, gain, shareAmount: Math.floor(gain*share/100), price, cap,
          belowMin: ltv < M.minLtv};
}

function calcDsr(){
  const solo  = S.fin.incomeSelf||0;
  const joint = solo + (S.fin.spouseEmployed ? (S.fin.incomeSpouse||0) : 0);
  const list = (S.fin.loans||[]).filter(L=>L.name).map(L=>({...L}));
  const MG = calcMortgage();
  // 전용 모기지를 첫 행으로 고정 — 조달 재원의 1순위이자 DSR의 최대 항목
  if(MG.on && MG.amount)
    list.unshift({name:"신혼희망타운 전용 모기지", type:"mortgage", fixedRow:true,
                  amount:MG.amount, rate:MG.rate, years:MG.years});
  const loanOffset = (MG.on && MG.amount) ? 1 : 0;   // rows[0] 이 모기지인 경우
  const r = RULES.dsr(list, solo);
  const dtiSolo  = RULES.dti(r.rows, solo);
  const dtiJoint = RULES.dti(r.rows, joint);
  const P = calcPrice();
  const priceWon = P.total*1000;
  const mortLoans = MG.amount + (planBySourceForm().L8c || 0);   // 주택 담보로 잡히는 대출
  return {rows:r.rows, annual:r.annual, solo, joint, mortgage:MG, loanOffset,
          soloRatio: solo>0 ? r.annual/solo*100 : 0,
          jointRatio: joint>0 ? r.annual/joint*100 : 0,
          dtiAnnual: dtiSolo.annual,
          dtiSolo: dtiSolo.ratio, dtiJoint: dtiJoint.ratio,
          mortLoans, priceWon,
          ltv: priceWon>0 ? mortLoans/priceWon*100 : 0};
}

/* ── 조달 (F3-1 → F4 연동) ────────────────────────────────────────────────
   시점별 자금 계획의 배분이 유일한 조달 입력입니다.
   재원 종류는 자금조달계획서 별지 제1호서식의 기재항목을 그대로 씁니다.        */
// 전용 모기지 실행액 (담보인정비율로 자동 계산)
function autoAmount(key){
  return key === "mortgage" ? calcMortgage().amount : 0;
}

/* ── 시점별 자금 계획 (F3-1) ───────────────────────────────────────────────
   지출 시점을 행으로 두고, 각 시점을 어떤 재원으로 막을지 배분해 적습니다.
   배분은 조달 재원 총액과 별개로 입력하고, 아래 「대조」에서 차이를 봅니다.
   중도금 집단대출을 쓰면 중도금 시점은 대출로 채우고, 잔금 시점에 상환 행이
   자동으로 생깁니다 (조달과 상환이 상쇄되므로 총 부담은 달라지지 않습니다).   */
function midLoanOn(){ return S.fin.midLoanOn !== false; }

function cashRows(){
  const P = calcPrice(), X = calcExtraCosts(), mid = midLoanOn();
  const rows = [
    {id:"c1", date:"2026.12",    n:`계약금 ${PROJECT.contractRate*100}%`, amt:P.contract*1000},
    {id:"c2", date:"2029.07.18", n:"중도금 20%", amt:P.mid*1000, midSrc:mid},
    {id:"c3", date:"2030.05",    n:"잔금", amt:P.balance*1000}
  ];
  if(mid) rows.push({id:"c4", date:"2030.05", n:"중도금 집단대출 상환", amt:P.mid*1000, repay:true});
  rows.push(
    {id:"c5", date:"2030.05",   n:"취득세 등",       amt:X.tax.total},
    {id:"c6", date:"2030.05",   n:"등기 부대비용",   amt:X.bond+X.judicial+X.stamp},
    {id:"c7", date:"2030.05",   n:"관리비 예치금",   amt:X.mgmt}
  );
  if(mid) rows.push({id:"c8", date:"2029~2030", n:"중도금 이자 (후불제)", amt:X.midInt});
  return rows;
}

// 배분에 쓸 수 있는 재원 목록
function planSources(){
  const list = [];
  PROJECT.filingLines.forEach(l=>{
    list.push({id:l.id, label:`${l.no} ${l.name}`});
    // ⑧ 주택담보대출 바로 아래에 전용 모기지를 따로 둡니다 (금액이 자동 계산됩니다)
    if(l.id === "L8") list.push({id:"MORT", label:"⑧ 금융기관 대출액 — 신혼희망타운 전용 모기지"});
  });
  if(midLoanOn()) list.push({id:"MID", label:"중도금 집단대출 (잔금 시 상환)"});
  return list;
}
// 배분 재원 → 서식 항목 (전용 모기지는 ⑧ 주택담보대출로 들어갑니다)
function srcToLine(id){ return id === "MORT" ? "L8" : id; }
function srcLabel(id){
  const s = planSources().find(x=>x.id===id);
  return s ? s.label : id;
}
// 닫힌 상태에서 보여줄 짧은 이름
function shortSrc(id){
  if(id === "MID")  return "중도금대출";
  if(id === "MORT") return "⑧ 전용 모기지";
  const l = PROJECT.filingLines.find(x=>x.id===id);
  if(!l) return id;
  const name = l.name.includes(" — ") ? l.name.split(" — ")[1] : l.name;
  return `${l.no} ${name.replace(/\s*\(.*\)$/,"")}`;
}
/* 배분 상태 — 맞으면 “적절”(초록), 모자라면 “부족 N원”(빨강), 넘치면 “초과 N원”(주황) */
function allocState(sum, need){
  const d = (Number(sum)||0) - (Number(need)||0);
  if(d === 0) return {label:"적절",              col:"var(--green)", ok:true};
  if(d < 0)   return {label:`부족 ${won(-d)}`,   col:"var(--red)",   ok:false};
  return           {label:`초과 ${won(d)}`,      col:"var(--amber)", ok:false};
}

// 한 번에 하나만 펼칩니다 — 다른 시점을 누르면 앞의 것은 닫힙니다
function togglePlan(id){
  const wasOpen = !!S.notes["_plan_"+id];
  cashRows().forEach(r=> delete S.notes["_plan_"+r.id]);
  if(!wasOpen) S.notes["_plan_"+id] = true;
  save(); render();
}
// 한 시점의 배분 목록 (중도금 시점의 집단대출은 자동으로 채웁니다)
function planAlloc(row){
  const manual = ((S.plan && S.plan[row.id]) || []).map(a=>
    a.src === "MORT" ? {...a, amt: calcMortgage().amount, locked:true} : a);
  if(row.midSrc) return [{src:"MID", amt:row.amt, auto:true}, ...manual];
  return manual;
}
function planSum(row){ return planAlloc(row).reduce((s,a)=>s+(Number(a.amt)||0), 0); }
/* 시점별 배분의 합계 (천원)
   중도금 집단대출은 잔금 시점에 상환 행으로 다시 나가므로 조달액에 넣지 않습니다. */
function planTotals(){
  const B = planBySource();
  let self = 0, loan = 0, mid = 0;
  Object.entries(B).forEach(([k,v])=>{
    if(k === "MID"){ mid += v; return; }
    const l = PROJECT.filingLines.find(x=>x.id===k);
    if(l && l.kind === "self") self += v; else loan += v;
  });
  return {self, loan, mid, total:self+loan};
}
// 재원별 배분 합계 (원)
function planBySource(){
  const out = {};
  cashRows().forEach(r=> planAlloc(r).forEach(a=>{
    out[a.src] = (out[a.src]||0) + (Number(a.amt)||0);
  }));
  return out;
}
/* 재원별로 묶은 배분 내역 — 금액, 쓰이는 시점, 계획서 반영 여부 */
function planSourceDetail(){
  const map = {};
  cashRows().forEach(r=> planAlloc(r).forEach(a=>{
    const v = Number(a.amt)||0;
    if(!map[a.src]) map[a.src] = {src:a.src, amt:0, rows:[], off:0, on:0, auto:!!a.auto};
    const g = map[a.src];
    g.amt += v;
    if(v) g.rows.push(r.n);
    if(a.auto) return;
    if(a.filing === false) g.off++; else g.on++;
  }));
  const self = [], loan = [], other = [];
  Object.values(map).filter(g=>g.amt).forEach(g=>{
    if(g.src === "MID"){ other.push(g); return; }
    const l = PROJECT.filingLines.find(x=>x.id===srcToLine(g.src));
    (l && l.kind === "self" ? self : loan).push(g);
  });
  const ord = g => planSources().findIndex(s=>s.id===g.src);
  self.sort((a,b)=>ord(a)-ord(b)); loan.sort((a,b)=>ord(a)-ord(b));
  const sum = arr => arr.reduce((s,g)=>s+g.amt, 0);
  return {self, loan, other, selfSum:sum(self), loanSum:sum(loan),
          midSum:sum(other), total:sum(self)+sum(loan)};
}

// 서식 항목 기준으로 합친 것 — 전용 모기지는 ⑧ 주택담보대출에 포함됩니다
function planBySourceForm(){
  const out = {};
  Object.entries(planBySource()).forEach(([k,v])=>{
    const line = srcToLine(k);
    out[line] = (out[line]||0) + v;
  });
  return out;
}

/* ── 자금조달계획서 연동 ────────────────────────────────────────────────────
   배분 한 건마다 붙은 「계획서 반영」 체크가 켜진 것만 서식 항목에 더합니다.
   중도금 집단대출은 서식 항목이 아니므로 애초에 빠집니다.                    */
function filingFromPlan(){
  const out = {};
  PROJECT.filingLines.forEach(l=>{ out[l.id] = 0; });
  cashRows().forEach(r=> planAlloc(r).forEach(a=>{
    if(a.auto || a.filing === false) return;
    const line = srcToLine(a.src);
    if(out[line] === undefined) return;
    out[line] += Number(a.amt)||0;
  }));
  return out;
}
function filingAuto(){ return filingFromPlan(); }
// 계획서에 반영하기로 체크한 배분의 건수·합계
function planFilingStat(){
  let n = 0, sum = 0;
  cashRows().forEach(r=> planAlloc(r).forEach(a=>{
    if(a.auto || a.filing === false) return;
    if(!PROJECT.filingLines.some(l=>l.id===srcToLine(a.src))) return;
    n++; sum += Number(a.amt)||0;
  }));
  return {n, sum};
}
function toggleAllocFiling(rowId, i){
  const a = S.plan[rowId][i];
  a.filing = (a.filing === false);   // undefined/true → false, false → true
  save(); render();
}
function addAlloc(rowId, src){
  if(!src) return;
  S.plan = S.plan || {}; S.plan[rowId] = S.plan[rowId] || [];
  S.plan[rowId].push({src, amt:0, filing:true});
  S.notes["_plan_"+rowId] = true;
  save(); render();
}
function delAlloc(rowId, i){ S.plan[rowId].splice(i,1); save(); render(); }
function setAllocSrc(rowId, i, src){ S.plan[rowId][i].src = src; save(); render(); }
// 남은 필요액을 그대로 채워 넣습니다
function fillAlloc(rowId, i){
  const row = cashRows().find(r=>r.id===rowId); if(!row) return;
  if(S.plan[rowId][i].src === "MORT") return;   // 금액이 자동 계산되는 항목
  const rest = row.amt - planSum(row) + (Number(S.plan[rowId][i].amt)||0);
  S.plan[rowId][i].amt = Math.max(0, rest); save(); render();
}

function calcCashflow(){
  const P = calcPrice(), X = calcExtraCosts(), PT = planTotals();
  const need = P.total*1000 + X.total;   // 신고금액 + 부대비용
  const have = PT.total;                 // 시점별 배분 합계 (집단대출 제외)
  return {P, X, PT, own:PT.self, loanSum:PT.loan, need, have, gap: have-need};
}

function calcNote(){
  const L = S.loanNote||{};
  const bal = L.balance||0;
  const yearly = bal*((L.rate||0)/100);
  const t = RULES.interestTax(yearly);
  const fair = bal*0.046;                                  // 적정이자율 4.6%
  const shortfall = Math.max(0, fair - yearly);
  const deemedGift = shortfall >= 10000000;                // 연 1천만원 이상이면 증여의제
  return {bal, rate:L.rate||0, yearly, tax:t, fair, shortfall, deemedGift,
          monthly:L.monthly||0};
}

function isActionableMilestone(m) {
  return m.kind !== "reference" && m.ddayMode === "exact";
}

function milestoneEndDelta(m) {
  return dday(m.d2 || m.d);
}

function progress() {
  const done = PROJECT.milestones.filter(m => S.done[m.id]).length;
  return {done, total:PROJECT.milestones.length, pct:Math.round(done / PROJECT.milestones.length * 100)};
}

function nextMilestone() {
  return PROJECT.milestones
    .filter(m => m.kind === "action" && m.ddayMode === "exact" && !S.done[m.id] && milestoneEndDelta(m) >= 0)
    .sort((a, b) => parseLocalDate(a.d) - parseLocalDate(b.d))[0] || null;
}

function milestoneStatus(m, done) {
  if (done) return {label:"완료", tone:"var(--green)"};
  if (m.ddayMode === "approx") return {label:"예정", tone:"var(--ink-2)"};
  if (m.ddayMode === "hidden") return {label:m.kind === "personal" ? "개인 목표" : "기준일", tone:"var(--ink-2)"};
  const start = dday(m.d);
  const end = milestoneEndDelta(m);
  if (m.d2 && start <= 0 && end >= 0) return {label:"진행 중", tone:"var(--red)"};

  return {label:ddayLabel(start), tone:start <= 7 ? "var(--red)" : start <= 30 ? "var(--amber)" : "var(--ink-2)"};
}

function icsEscape(value) {
  return String(value || "").replace(/\\/g, "\\\\").replace(/\r?\n/g, "\\n").replace(/;/g, "\\;").replace(/,/g, "\\,");
}

function foldIcsLine(line) {
  const encoder = new TextEncoder();
  const parts = [];
  let part = "";
  let bytes = 0;
  for (const char of line) {
    const size = encoder.encode(char).length;
    if (bytes + size > 73 && part) {
      parts.push(part);
      part = "";
      bytes = 0;
    }
    part += char;
    bytes += size;
  }
  if (part) parts.push(part);
  return parts.join("\r\n ");
}

function compactIcsDateTime(value) {
  return value.replace(/[-:]/g, "").replace("T", "T") + "00";
}

function addMinutes(value, minutes) {
  const [date, time] = value.split("T");
  const [year, month, day] = date.split("-").map(Number);
  const [hour, minute] = time.split(":").map(Number);
  const d = new Date(year, month - 1, day, hour, minute + minutes);
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function datesBetween(start, end) {
  const result = [];
  const cursor = parseLocalDate(start);
  const finish = parseLocalDate(end);
  const pad = n => String(n).padStart(2, "0");
  while (cursor <= finish) {
    result.push(`${cursor.getFullYear()}-${pad(cursor.getMonth() + 1)}-${pad(cursor.getDate())}`);
    cursor.setDate(cursor.getDate() + 1);
  }
  return result;
}

function calendarDescription(m) {
  return [
    `할 일: ${m.todo}`,
    m.need && m.need !== "—" ? `준비물: ${m.need}` : "",
    m.miss && m.miss !== "—" ? `미이행 시: ${m.miss}` : "",
    m.place ? `장소: ${m.place}` : "",
    `공식 시간: ${m.timeLabel}`,
    `근거: ${m.cite}`,
    m.kind === "personal" ? "구분: 개인 목표" : "구분: 공식 일정"
  ].filter(Boolean).join("\n");
}

function calendarEvents() {
  const events = [];
  for (const m of PROJECT.milestones) {
    if (!m.calendar || S.done[m.id] || milestoneEndDelta(m) < 0) continue;
    const base = {m, summary:m.t, description:calendarDescription(m), location:m.place || ""};
    if (m.calendar.mode === "window") {
      events.push({...base, uidSuffix:"", start:m.calendar.start, end:m.calendar.end});
    } else if (m.calendar.mode === "at") {
      events.push({...base, uidSuffix:"", start:m.calendar.start, end:addMinutes(m.calendar.start, m.calendar.minutes || 30)});
    } else if (m.calendar.mode === "daily") {
      for (const date of datesBetween(m.calendar.startDate, m.calendar.endDate)) {
        events.push({...base, uidSuffix:`-${date.replaceAll("-", "")}`, start:`${date}T${m.calendar.startTime}`, end:`${date}T${m.calendar.endTime}`});
      }
    }
  }
  return events;
}

function buildCalendarIcs() {
  const stampValue = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d{3}Z$/, "Z");
  const lines = [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//Bokjeong2 A1//56T Winner Planner//KO",
    "CALSCALE:GREGORIAN",
    "METHOD:PUBLISH",
    "BEGIN:VTIMEZONE",
    "TZID:Asia/Seoul",
    "X-LIC-LOCATION:Asia/Seoul",
    "BEGIN:STANDARD",
    "TZOFFSETFROM:+0900",
    "TZOFFSETTO:+0900",
    "TZNAME:KST",
    "DTSTART:19700101T000000",
    "END:STANDARD",
    "END:VTIMEZONE"
  ];
  for (const event of calendarEvents()) {
    const m = event.m;
    lines.push(
      "BEGIN:VEVENT",
      `UID:${PROJECT.id}-${VARIANT}-${m.id}${event.uidSuffix}@example.local`,
      `DTSTAMP:${stampValue}`,
      `DTSTART;TZID=Asia/Seoul:${compactIcsDateTime(event.start)}`,
      `DTEND;TZID=Asia/Seoul:${compactIcsDateTime(event.end)}`,
      `SUMMARY:${icsEscape(event.summary)}`,
      `DESCRIPTION:${icsEscape(event.description)}`
    );
    if (event.location) lines.push(`LOCATION:${icsEscape(event.location)}`);
    lines.push("END:VEVENT");
  }
  lines.push("END:VCALENDAR");
  return lines.map(foldIcsLine).join("\r\n") + "\r\n";
}

function exportCalendar() {
  const count = calendarEvents().length;
  if (!count) return toast("내보낼 유효한 공식 일정이 없습니다");
  const blob = new Blob([buildCalendarIcs()], {type:"text/calendar;charset=utf-8"});
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = `성남복정2_A1_${VARIANT}_일정_${stamp()}.ics`;
  link.click();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  toast(`${count}개 일정을 캘린더 파일로 내보냈습니다`);
}

function thumb(key, cap, cls) {

  const safeCap = esc(cap);
  const jsCap = safeCap.replace(/'/g, "\\'");
  return `<img class="${cls}" src="${src}" alt="${safeCap}" loading="lazy" onclick="event.preventDefault();event.stopPropagation();openLb('${key}','${jsCap}')">`;
}

function imgKey(key) {
  return key + "__" + VARIANT;
}

function optionThumb(group, item, cls) {
  const key = item ? (item.img || item.id) : group.g + "_base";
  const cap = item ? (item.imgCap || (group.n + " — " + item.l)) : (group.n + " 기본형 — " + group.base);
  const src = IMG[imgKey(key)];
  const jsGroup = JSON.stringify(group.g);
  const trigger = "event.preventDefault();event.stopPropagation();openOptionCompare(" + jsGroup + ")";
  if (!src) return "<span class=\""+ cls + " ph compare-trigger\" role=\"button\" tabindex=\"0\" aria-label=\"" + esc(cap) + " 사진 없음 · 옵션 비교\" onclick='" + trigger + "' onkeydown=\"if(event.key==='Enter'||event.key===' '){event.preventDefault();" + trigger + "}\">사진<br>없음</span>";
  return "<img class=\"" + cls + " compare-trigger\" src=\"" + src + "\" alt=\"" + esc(cap) + "\" loading=\"lazy\" onclick='" + trigger + "'>";
}

function optionCompareEntries(group) {
  return [
    {id:"base", base:true, label:group.base, price:0, key:group.g + "_base", available:{ok:true}},

}

function optionCompareImage(entry, alt, cls) {

function optionCompareIsSelected(group, entry) {

function renderOptionCompare() {
  if (!OPT_COMPARE) return;

  OPT_COMPARE.selected = selected.id;
  const alt = selected.base ? group.n + " 기본형 — " + group.base : group.n + " — " + selected.label;
  const jsGroup = JSON.stringify(group.g);
  const choiceValue = selected.base ? "base" : selected.id;
  const chosen = optionCompareIsSelected(group, selected);
  const selectable = selected.base || selected.available.ok;
  const choiceType = group.pick ? "radio" : "checkbox";

  const priceLabel = selected.base ? "기본형 · 무상" : (selected.price ? kwon(selected.price) : "무상");
  const change = " onchange='selectOptionCompare(" + jsGroup + "," + JSON.stringify(choiceValue) + ")'";

  const unavailable = selectable ? "" : "<div class=\"lb-compare-unavailable\">선택 불가 · " + esc(selected.available.why || "현재 공간선택과 맞지 않습니다.") + "</div>";
  const main = "<div class=\"lb-compare-main\">"
    + optionCompareImage(selected, alt, "lb-compare-main-img")

    + "<div class=\"lb-compare-main-price\">" + priceLabel + "</div>"

    + unavailable + "</div>";
  const strip = entries.map(entry => {
    const entryAlt = entry.base ? group.n + " 기본형 — " + group.base : group.n + " — " + entry.label;
    const entryPrice = entry.base ? "기본형 · 무상" : (entry.price ? kwon(entry.price) : "무상");

    return "<button type=\"button\" class=\"lb-compare-thumb\" role=\"tab\" aria-selected=\"" + selectedAttr + "\" aria-label=\"" + esc(entryAlt) + "\"" + click + ">"
      + optionCompareImage(entry, entryAlt, "lb-compare-thumb-img")

  panel.innerHTML = "<div class=\"lb-compare-top\"><div><div class=\"lb-compare-title\">옵션 비교</div><div class=\"lb-compare-sub\">" + esc(group.n) + " · 이미지·명칭·가격을 비교하세요</div></div><button type=\"button\" class=\"lb-compare-close\" onclick=\"closeLb()\" aria-label=\"옵션 비교 닫기\">✕</button></div>"
    + main
    + "<div class=\"lb-compare-strip\" role=\"tablist\" aria-label=\"" + esc(group.n) + " 비교 목록\">" + strip + "</div>";
  panel.setAttribute("aria-hidden", "false");
}

function openOptionCompare(groupG) {
  const group = optionTable().find(candidate => candidate.g === groupG);
  if (!group) return;
  const current = S.sel.opts[group.g];

function chooseOptionCompare(groupG, id) {
  if (!OPT_COMPARE || OPT_COMPARE.group !== groupG) return;
  const group = optionTable().find(candidate => candidate.g === groupG);
  if (!group || !optionCompareEntries(group).some(entry => entry.id === id)) return;
  OPT_COMPARE.selected = id;
  renderOptionCompare();
}

function selectOptionCompare(groupG, id) {
  const group = optionTable().find(candidate => candidate.g === groupG);
  const entry = group && optionCompareEntries(group).find(candidate => candidate.id === id);
  if (!group || !entry) return;
  if (!entry.base && !entry.available.ok) {
    renderOptionCompare();
    return toast("현재 선택에서는 " + (entry.available.why || "선택할 수 없는 옵션"));
  }
  pickOpt(groupG, entry.base ? null : entry.id);
  if (OPT_COMPARE && OPT_COMPARE.group === groupG) {
    OPT_COMPARE.selected = entry.base ? "base" : entry.id;
    renderOptionCompare();
  }
}

/* ── 라이트박스/* ── 라이트박스 — 확대·이동 ────────────────────────────────────────────
   평면도의 치수 숫자를 읽으려면 확대가 필요합니다.
   휠·두 손가락 = 줌, 끌기 = 이동, 두 번 누르기 = 3배 토글.
   원래 크기일 때는 배경이나 그림을 눌러 닫습니다.                        */
let LB = {s:1, x:0, y:0};
function lbApply(){
  const el = $("#lb"), img = $("#lbImg");
  if(LB.s <= 1.001){ LB.s = 1; LB.x = 0; LB.y = 0; }
  el.classList.toggle("z", LB.s > 1);
  img.style.transform = `translate(${LB.x}px, ${LB.y}px) scale(${LB.s})`;
  const pct = $("#lbPct"); if(pct) pct.textContent = Math.round(LB.s*100) + "%";
}
function lbFit(){ LB = {s:1, x:0, y:0, tap:0}; lbApply(); }
// 화면상의 한 점(cx,cy)을 고정한 채 배율만 바꿉니다
function lbScaleAt(next, cx, cy){
  const img = $("#lbImg"); if(!img) return;
  next = Math.min(8, Math.max(1, next));
  const r = img.getBoundingClientRect();
  const ox = r.left + r.width/2, oy = r.top + r.height/2;   // 현재 중심
  const k = next / LB.s;
  LB.x = cx - k*(cx - ox) - (ox - LB.x);
  LB.y = cy - k*(cy - oy) - (oy - LB.y);
  LB.s = next;
  lbApply();
}
function lbZoom(dir){
  const st = $("#lbStage").getBoundingClientRect();
  lbScaleAt(LB.s * (dir > 0 ? 1.5 : 1/1.5), st.left + st.width/2, st.top + st.height/2);
}
function openLb(key, cap){
  const el = $("#lb");
  OPT_COMPARE = null;
  el.classList.remove("compare-mode");
  const compare = $("#lbCompare");
  if(compare){ compare.innerHTML = ""; compare.setAttribute("aria-hidden", "true"); }
  $("#lbImg").src = IMG[imgKey(key)] || "";
  $("#lbCap").textContent = cap || "";
  lbFit(); el.classList.add("on");
}
function closeLb(){
  const el = $("#lb");
  el.classList.remove("on","z","drag","compare-mode");
  $("#lbImg").src = "";
  const compare = $("#lbCompare");
  if(compare){ compare.innerHTML = ""; compare.setAttribute("aria-hidden", "true"); }
  OPT_COMPARE = null;
  lbFit();
}

(function lbGestures(){
  const stage = document.getElementById("lbStage");
  const pts = new Map();
  let base = 0, baseScale = 1, moved = 0;

  const dist = () => {
    const [a,b] = [...pts.values()];
    return Math.hypot(a.x-b.x, a.y-b.y);
  };
  const mid = () => {
    const [a,b] = [...pts.values()];
    return {x:(a.x+b.x)/2, y:(a.y+b.y)/2};
  };

  stage.addEventListener("pointerdown", e=>{
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    stage.setPointerCapture(e.pointerId);
    if(pts.size === 2){ base = dist(); baseScale = LB.s; }
    if(pts.size === 1) moved = 0;
    $("#lb").classList.add("drag");
  });

  stage.addEventListener("pointermove", e=>{
    const p = pts.get(e.pointerId); if(!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    moved += Math.abs(dx) + Math.abs(dy);
    if(pts.size === 2 && base > 0){
      const m = mid();
      lbScaleAt(baseScale * (dist()/base), m.x, m.y);
    } else if(LB.s > 1){
      LB.x += dx; LB.y += dy; lbApply();
    }
  });

  const up = e=>{
    pts.delete(e.pointerId);
    if(pts.size < 2) base = 0;
    if(pts.size === 0){
      $("#lb").classList.remove("drag");
      if(moved < 8){
        const now = Date.now();
        if(LB.tap && now - LB.tap < 300){    // 두 번 누르기 → 3배 토글
          LB.tap = 0;
          if(LB.s > 1) lbFit(); else lbScaleAt(3, e.clientX, e.clientY);
        } else {
          LB.tap = now;
          const t = now;
          // 원래 크기에서 한 번만 누르면 닫습니다 (두 번째 누름이 오면 취소)
          if(LB.s <= 1) setTimeout(()=>{ if(LB.tap === t) closeLb(); }, 300);
        }
      }
      moved = 0;
    }
  };
  stage.addEventListener("pointerup", up);
  stage.addEventListener("pointercancel", up);

  stage.addEventListener("wheel", e=>{
    e.preventDefault();
    lbScaleAt(LB.s * (e.deltaY < 0 ? 1.18 : 1/1.18), e.clientX, e.clientY);
  }, {passive:false});
})();

});

function promptOrDefault(message, fallback) {
  try {
    const value = window.prompt(message, fallback);
    return value === null ? null : value;
  } catch (error) {
    return fallback;
  }
}

function confirmOrCancel(message) {
  try {
    return window.confirm(message);
  } catch (error) {
    return false;
  }
}

function filingTotals() {
  let sum = 0;
  let self = 0;
  let loan = 0;
  PROJECT.filingLines.forEach(line => {
    const value = Number((S.filing || {})[line.id]) || 0;
    sum += value;
    if (line.kind === "self") self += value;
    else loan += value;
  });
  return {sum, self, loan};
}

function saveSel() {
  const snap = selSnapshot();
  const defaultName = `56T ${snap.space} · 옵션 ${snap.optCount}개`;
  const name = promptOrDefault("56T 시나리오 이름 — 옵션과 자금 입력을 통째로 저장합니다", defaultName);
  if (name === null) return;
  snap.name = name.trim() || defaultName;
  S.saved = (S.saved || []).filter(v => savedVariant(v) === VARIANT);
  S.saved.unshift(snap);
  if (S.saved.length > SAVED_MAX) S.saved.length = SAVED_MAX;
  save();
  render();
  toast("56T 시나리오를 저장했습니다");
}

function loadSel(id) {
  const value = (S.saved || []).find(item => item.id === id);
  if (!value) return;
  if (savedVariant(value) !== VARIANT) return toast("56T 전용 앱이라 다른 주택형 선택안은 불러오지 않았습니다.");
  const full = !!value.state;
  const what = full ? "옵션과 자금 입력 전부" : "옵션 선택만";
  if (!confirmOrCancel(`‘${value.name}’을 불러옵니다.\n\n${what}가 지금 값을 덮어씁니다. 계속할까요?`)) return;
  if (full) {
    STATE_KEYS.forEach(key => {
      if (value.state[key] !== undefined) S[key] = structuredClone(value.state[key]);
    });
  } else {
    S.sel = structuredClone(value.sel);
  }
  S.sel = normalizeSel(S.sel);
  S = migrate(S);
  save();
  render({top:true});
  toast(`‘${value.name}’ 56T 시나리오를 불러왔습니다`);
}

function delSel(id) {
  const value = (S.saved || []).find(item => item.id === id);
  if (!value) return;
  if (!confirmOrCancel(`‘${value.name}’을 지웁니다. 계속할까요?`)) return;
  S.saved = S.saved.filter(item => item.id !== id);
  save();
  render();
  toast("삭제했습니다");
}

function renameSel(id) {
  const value = (S.saved || []).find(item => item.id === id);
  if (!value) return;

function toggleSel(id) {
  S.notes["_sel_" + id] = !S.notes["_sel_" + id];

function isCurrent(value) {
  return savedVariant(value) === VARIANT && JSON.stringify(normalizeSel(value.sel)) === JSON.stringify(normalizeSel(S.sel));
}

function selFileName(value) {
  const title = value ? value.name : "전체";
  const safe = String(title).replace(/[\\/:*?"<>|]/g, "_").replace(/\s+/g, " ").trim().slice(0, 40);
  return `프로젝트_${PROJECT.id}_${VARIANT}_${safe}_${stamp()}.json`;
}

function downloadJson(object, filename) {
  const blob = new Blob([JSON.stringify(object, null, 2)], {type:"application/json"});
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = filename;
  link.click();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
}

function exportSel(id) {
  const all = (S.saved || []).filter(value => savedVariant(value) === VARIANT);
  const one = id ? all.find(value => value.id === id) : null;
  const list = one ? [one] : all;
  if (!list.length) return toast("저장한 56T 시나리오가 없습니다");
  downloadJson({...SEL_FILE, variant:VARIANT, project:PROJECT.id, projectName:PROJECT.name, exported:stamp(true), saved:structuredClone(list)}, selFileName(one));
  toast(one ? "56T 시나리오 파일을 저장했습니다 (자금 입력 포함)" : `${list.length}개 56T 시나리오를 저장했습니다 (자금 입력 포함)`);
}

function importSel() {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "application/json,.json";
  input.onchange = () => {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let data;
      try {
        data = JSON.parse(reader.result);
      } catch (error) {
        return toast("JSON 파일이 아닙니다");
      }
      if (data && data.project && data.project !== PROJECT.id) return toast(`다른 단지의 파일입니다 (${data.project})`);
      if (data && data.variant && data.variant !== VARIANT) return toast("56T 전용 앱이라 다른 주택형 선택안은 불러오지 않았습니다.");

      if (data && data.kind === "state" && data.state) {
        if (savedVariant({variant:data.variant, state:data.state}) !== VARIANT) return toast("56T 전용 앱이라 다른 주택형 선택안은 불러오지 않았습니다.");
        if (!confirmOrCancel("56T 전체 백업을 불러오면 현재 입력을 덮어씁니다. 계속할까요?")) return;
        S = migrate(Object.assign(structuredClone(BLANK), structuredClone(data.state)));
        save();
        render({top:true});
        return toast("56T 전체 백업을 불러왔습니다");
      }

      const list = Array.isArray(data) ? data : (data && Array.isArray(data.saved) ? data.saved : null);
      if (!list) return toast("선택안 파일이 아닙니다");
      const candidates = list.filter(value => value && typeof value === "object" && typeof value.total === "number" && (value.sel || value.type));
      const valid = candidates.filter(value => savedVariant(value) === VARIANT);
      const excluded = candidates.length - valid.length;
      if (!valid.length) return toast("56T 전용 앱이라 다른 주택형 선택안은 불러오지 않았습니다.");

      S.saved = (S.saved || []).filter(value => savedVariant(value) === VARIANT);
      const existing = new Set(S.saved.map(value => value.id));
      let added = 0;
      valid.forEach(value => {
        const copy = normalizeSaved(value);
        const duplicate = existing.has(copy.id);
        if (duplicate) copy.id = `v${Date.now()}_${added}`;
        copy.name = (copy.name || "이름 없음") + (duplicate ? " (사본)" : "");
        S.saved.unshift(copy);
        existing.add(copy.id);
        added += 1;
      });
      let message = `${added}개 56T 시나리오를 불러왔습니다`;
      if (excluded) message += ` · 다른 주택형 ${excluded}개 제외`;
      if (S.saved.length > SAVED_MAX) {
        message += ` · 오래된 ${S.saved.length - SAVED_MAX}개 제외`;
        S.saved.length = SAVED_MAX;
      }
      save();
      render();
      toast(message);
    };
    reader.readAsText(file);
  };
  input.click();
}

/* 시점 한 줄 — 필요액 / 배분액, 펼치면 재원별로 배분해 적습니다 */

  const open = !!S.notes["_plan_"+r.id];
  const alloc = planAlloc(r);
  const sum = planSum(r);
  const st = allocState(sum, r.amt);
  const col = st.col;
  const srcs = planSources();
  return `
  <div class="opt-g">
    <div class="row" style="align-items:flex-start;cursor:pointer"
      onclick="togglePlan('${r.id}')">

        <div class="opt-name">${open?"▾":"▸"} ${esc(r.n)}
          ${r.repay?'<span class="badge b-amber" style="margin-left:4px">상환</span>':""}</div>
        <div class="opt-base">${esc(r.date)}</div>
      </div>
      <div style="text-align:right">
        <b class="num sm">${won(r.amt)}</b>
        <div class="tiny" style="color:${col};font-weight:600">
          ${sum?won(sum):"미배분"}${sum?` · ${st.label}`:""}</div>
      </div>
    </div>
    ${!open && alloc.length ? `
    <div class="chips">
      ${alloc.map(a=>`<span class="chip${a.auto?" auto":(a.filing===false?" off":"")}"
        ${a.filing===false?'title="계획서 미반영"':""}>
        <b>${esc(shortSrc(a.src))}</b> ${man(a.amt)}</span>`).join("")}
    </div>` : ""}
    ${open ? `
    <div style="margin-top:10px">
      ${alloc.length ? alloc.map((a,i)=> a.auto ? `
        <div class="kv"><span>${esc(srcLabel(a.src))}
          <span class="badge b-gray" style="margin-left:4px">자동</span></span>
          <b>${won(a.amt)}</b></div>`
      : (()=>{ const j = i - (r.midSrc?1:0);
                const inForm = PROJECT.filingLines.some(l=>l.id===srcToLine(a.src));
                const on = a.filing !== false; return `
        <div style="padding:9px 0;border-bottom:1px solid var(--line)">
          <div class="row" style="margin-bottom:6px">
            <select style="flex:1" onchange="setAllocSrc('${r.id}',${j},this.value)">
              ${srcs.map(s=>`<option value="${s.id}" ${a.src===s.id?"selected":""}>${esc(s.label)}</option>`).join("")}
            </select>
            <button class="btn sm" onclick="delAlloc('${r.id}',${j})">삭제</button>
          </div>
          ${a.src === "MORT" ? `
            <div class="note i" style="margin-bottom:8px">
              금액은 아래에서 고른 담보인정비율로 자동 계산됩니다.</div>
            ${mortgageCard(true)}`
          : `
          <div style="display:flex;gap:7px;align-items:flex-start">
            <div style="flex:1">${numRow("금액",`plan.${r.id}.${j}.amt`)}</div>
            <button class="btn sm" style="margin-top:20px" onclick="fillAlloc('${r.id}',${j})"

          </div>`}

            <input type="checkbox" ${on?"checked":""} readonly>
            <div class="opt-l">자금조달계획서에 반영
              <div class="opt-why" style="color:var(--ink-3)">
                ${on?`이 금액이 ${esc(shortSrc(a.src))} 항목에 더해집니다`

        </div>`; })()).join("")
      : `<div class="tiny muted">아직 배분한 재원이 없습니다.</div>`}
      <div class="kv" style="margin-top:4px">
        <span><b>배분 합계</b></span>
        <b style="color:${col}">${won(sum)} · ${st.label}</b></div>

/* 지표 게이지 한 줄 — 값 / 기준선 / 통과 여부 */
function gaugeRow(label, value, limit){
  const over = value > limit;
  const col = over ? "var(--red)" : value > limit*0.9 ? "var(--amber)" : "var(--green)";
  return `
  <div class="gauge"><i style="width:${Math.min(100,value)}%;background:${col}"></i>
    <u style="left:${Math.min(100,limit)}%"></u></div>
  <div class="row tiny"><span class="muted">${esc(label)} · 기준 ${pct(limit)}%</span>
    <b style="color:${col};font-size:14px">${value.toFixed(1)}% ${over?"🔴 부결":"✅ 통과"}</b></div>`;
}

}

function addLoan(){
  S.fin.loans = S.fin.loans||[];

  save(); render();
}
function delLoan(i){
  const L = S.fin.loans[i];
  if(L && (L.name || L.amount || L.limit) && !confirm(`‘${L.name||"이름 없는 대출"}’을 지웁니다. 계속할까요?`)) return;
  S.fin.loans.splice(i,1); save(); render();
}
function setLoanType(i, t){
  const L = S.fin.loans[i]; if(!L) return;
  // 마이너스통장은 한도, 그 밖에는 금액 — 칸이 바뀌므로 값을 옮겨 줍니다
  if(t==="line" && L.type!=="line"){ L.limit = L.limit || L.amount || 0; }
  if(t!=="line" && L.type==="line"){ L.amount = L.amount || L.limit || 0; }
  L.type = t; save(); render();
}

function filingRow(l){
  const v = S.filing?.[l.id] ?? "";
  const auto = filingAuto()[l.id];
  const linked = auto !== undefined;
  const edited = linked && Number(v||0) !== auto;
  return `
  <div>
    <label class="f">${l.no} ${esc(l.name)}
      ${l.risk==="high"?'<span class="badge b-red" style="margin-left:4px">주의</span>':""}
      ${linked && !edited ? '<span class="badge b-green" style="margin-left:4px">연동</span>':""}
      ${edited ? '<span class="badge b-amber" style="margin-left:4px">수정</span>':""}</label>
    <input type="number" data-k="filing.${l.id}" value="${v}" placeholder="0"
      step="1" inputmode="numeric"
      oninput="setFiling('${l.id}',this.value,this)" onchange="render()">
    <div class="numhint" data-hint="filing.${l.id}">${v?man(v)+"원":"&nbsp;"}</div>
    <div class="tiny muted">
      단위 원${l.hint?` · ${esc(l.hint)}`:""}
      ${edited?`<br>조달 재원 기준 <b>${won(auto)}</b>
        <button class="btn sm" style="padding:2px 7px;margin-left:5px"
          onclick="S.filing['${l.id}']=${auto};save();render()">맞추기</button>`:""}
      ${l.why?`<br>⚠ ${esc(l.why)}`:""}</div>
  </div>`;
}
function setFiling(id, val, el){
  S.filing = S.filing || {};
  S.filing[id] = Math.round(Number(val)||0);
  save();
  if(el && el.parentNode){
    const h = el.parentNode.querySelector('[data-hint="filing.'+id+'"]');
    if(h) h.innerHTML = S.filing[id] ? man(S.filing[id])+"원" : "&nbsp;";
  }
}

// 조달 재원 → 계획서 일괄 반영 (연동되지 않는 항목은 건드리지 않음)
function pullFunding(){
  const auto = filingAuto();
  S.filing = S.filing || {};
  Object.keys(auto).forEach(k => S.filing[k] = auto[k]);
  save(); render(); toast("조달 재원을 계획서에 반영했습니다");
}

function chkRow(id, t, s, bag){

  return `
  <label class="chk ${on?"done":""}" onclick="event.preventDefault();S['${bag}']['${id}']=!S['${bag}']['${id}'];save();render()">

    <div><div class="chk-t">${esc(t)}</div><div class="chk-s">${esc(s)}</div></div>
